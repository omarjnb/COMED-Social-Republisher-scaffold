services:
  - type: web
    name: comed-social-republisher
    runtime: docker
    healthCheckPath: /healthz
    plan: starter
    envVars:
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: comed-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
databases:
  - name: comed-db
    plan: starter
    # Current Render Postgres plan ID. Free is suitable only for this 30-day pilot.
    plan: free
